name: Bug report
description: Report a reproducible problem in the pipeline
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected behaviour and the observed behaviour.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Provide the smallest non-sensitive example possible.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Python version, operating system, and package versions.
    validations:
      required: true
